<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The House Tab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B2A3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="House Tab">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE4D3;
    --paper-dark:#E2D6BE;
    --paper-shadow:#c9bb9c;
    --ink:#2b2621;
    --navy:#1B2A3A;
    --rust:#AE4436;
    --sage:#5C7A5F;
    --gold:#B8901F;
    --line:#c7b89a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(transparent, transparent 27px, var(--line) 28px),
      var(--paper);
    background-attachment:local;
    color:var(--ink);
    font-family:'Libre Baskerville', serif;
    min-height:100vh;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:36px 28px 80px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px double var(--navy);
    padding-bottom:14px;
    margin-bottom:0;
    flex-wrap:wrap;
    gap:14px;
  }
  h1{
    font-family:'Special Elite', monospace;
    font-size:2rem;
    color:var(--navy);
    margin:0;
    letter-spacing:0.5px;
  }
  .subtitle{
    font-style:italic;
    font-size:0.9rem;
    color:#6b6156;
    margin:4px 0 0;
  }
  .balance-box{ text-align:right; font-family:'IBM Plex Mono', monospace; display:flex; flex-direction:column; align-items:flex-end; }
  .stats-row{ display:flex; gap:22px; }
  .stat-group{ text-align:right; }
  .balance-label{
    font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; color:#6b6156;
  }
  .balance-amount{ font-size:1.9rem; color:var(--rust); font-weight:600; }
  .balance-amount.positive{ color:var(--sage); }
  .balance-amount.negative{ color:var(--rust); }
  .balance-sub{ font-size:0.72rem; color:#6b6156; }
  .save-status{
    font-size:0.68rem; margin-top:4px; color:var(--sage); min-height:14px;
    transition:opacity .3s ease;
  }
  .save-status.error{ color:var(--rust); font-weight:600; }

  .page-nav{ display:flex; gap:8px; margin:20px 0 22px; }
  .page-nav-btn{
    flex:1; font-family:'Special Elite', monospace; font-size:0.95rem;
    padding:12px 16px; background:var(--paper-dark); border:1px solid var(--paper-shadow);
    border-radius:6px; color:#6b6156; cursor:pointer; text-align:center;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .page-nav-btn.active{ background:var(--navy); color:var(--paper); border-color:var(--navy); }
  .page-nav-btn[data-page="balance"].active{ background:var(--sage); border-color:var(--sage); }
  .page{ display:none; }
  .page.active{ display:block; }

  .tabs{ display:flex; gap:4px; margin:0; overflow-x:auto; padding-bottom:2px; }
  .tab{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; padding:8px 14px 7px;
    background:var(--paper-dark); border:1px solid var(--paper-shadow); border-bottom:none;
    border-radius:6px 6px 0 0; cursor:pointer; color:#665c4f; white-space:nowrap;
    transform:translateY(3px); transition:transform .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{
    background:var(--paper); color:var(--navy); font-weight:600; transform:translateY(0);
    border-color:var(--navy); box-shadow:0 -2px 0 var(--navy) inset;
  }

  .sheet{
    background:var(--paper); border:1px solid var(--paper-shadow); border-top:4px solid var(--navy);
    padding:0; position:relative; box-shadow:0 6px 18px rgba(0,0,0,0.12);
  }
  .sheet.balance-sheet{ border-top-color:var(--sage); }
  .margin-rule{ position:absolute; left:56px; top:0; bottom:0; width:1px; background:var(--rust); opacity:0.55; }
  .margin-rule.balance-rule{ background:var(--sage); }

  .new-entry{ padding:20px 24px 20px 74px; border-bottom:2px dashed var(--paper-shadow); position:relative; }
  .form-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .field{ flex:1; min-width:140px; }
  label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:1px; color:#8a7d6a; margin-bottom:4px;
  }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font-family:'Libre Baskerville', serif; font-size:0.95rem; padding:8px 10px;
    background:#fbf7ee; border:1px solid var(--paper-shadow); border-radius:3px; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  textarea{ resize:vertical; min-height:44px; }
  .amount-field input{ font-family:'IBM Plex Mono', monospace; color:var(--rust); font-weight:600; }
  .balance-page .amount-field input{ color:var(--sage); }

  .voice-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .mic-btn{
    display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    background:var(--navy); color:var(--paper); border:none; padding:9px 14px; border-radius:20px;
    cursor:pointer; transition:background .15s ease, transform .1s ease;
  }
  .mic-btn:hover{ background:#25384d; }
  .mic-btn:active{ transform:scale(0.97); }
  .mic-btn.recording{ background:var(--rust); animation:pulse 1.2s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(174,68,54,0.5);}
    70%{ box-shadow:0 0 0 9px rgba(174,68,54,0);}
    100%{ box-shadow:0 0 0 0 rgba(174,68,54,0);}
  }
  .voice-preview{
    font-size:0.8rem; color:var(--sage); font-family:'IBM Plex Mono', monospace;
    display:flex; align-items:center; gap:6px;
  }
  .voice-preview button{
    background:none; border:1px solid var(--sage); color:var(--sage); border-radius:12px;
    font-size:0.7rem; padding:2px 8px; cursor:pointer;
  }
  .mic-status{ font-size:0.75rem; color:#8a7d6a; font-style:italic; }

  .submit-btn{
    font-family:'Special Elite', monospace; font-size:0.95rem; background:var(--rust); color:var(--paper);
    border:none; padding:10px 22px; border-radius:3px; cursor:pointer; letter-spacing:0.5px;
    transition:background .15s ease;
  }
  .submit-btn:hover{ background:#933a2e; }
  .submit-btn.income-btn{ background:var(--sage); }
  .submit-btn.income-btn:hover{ background:#4a6650; }

  .entries{ padding:6px 24px 22px 74px; }
  .entry{
    display:flex; align-items:flex-start; gap:14px; padding:14px 0;
    border-bottom:1px solid var(--line); position:relative;
  }
  .entry:last-child{ border-bottom:none; }
  .entry-date{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:#8a7d6a;
    width:78px; flex-shrink:0; padding-top:2px;
  }
  .entry-main{ flex:1; min-width:0; }
  .entry-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tag{
    font-family:'IBM Plex Mono', monospace; font-size:0.65rem; text-transform:uppercase;
    letter-spacing:0.5px; padding:2px 8px; border-radius:10px; color:#fff;
  }
  .entry-note{ margin:5px 0 0; font-size:0.92rem; color:var(--ink); line-height:1.4; word-wrap:break-word; }
  .entry-voice{ margin-top:6px; display:flex; align-items:center; gap:8px; }
  .play-btn{
    background:var(--sage); color:#fff; border:none; width:28px; height:28px; border-radius:50%;
    cursor:pointer; font-size:0.75rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .voice-label{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--sage); font-style:italic; }
  .entry-amount{
    font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--rust); font-size:1rem;
    white-space:nowrap; padding-top:2px;
  }
  .entry-amount.income{ color:var(--sage); }
  .entry-balance{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem;
    color:#8a7d6a;
    text-align:right;
    margin-top:3px;
  }
  .delete-btn{ background:none; border:none; color:#b3a68d; cursor:pointer; font-size:0.9rem; padding:2px 4px; line-height:1; }
  .delete-btn:hover{ color:var(--rust); }

  .empty-state{ padding:40px 24px; text-align:center; color:#8a7d6a; font-style:italic; }
  .footer-note{ text-align:center; font-size:0.72rem; color:#8a7d6a; margin-top:18px; font-family:'IBM Plex Mono', monospace; }

  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--paper-shadow); border-radius:3px; }

  @media (max-width:560px){
    .margin-rule{ left:38px; }
    .new-entry, .entries{ padding-left:48px; }
    h1{ font-size:1.5rem; }
    .balance-amount{ font-size:1.3rem; }
    .stats-row{ gap:14px; }
    .page-nav-btn{ font-size:0.82rem; padding:10px 8px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>The House Tab</h1>
      <p class="subtitle" id="pageSubtitle">a running account of what the house costs to keep</p>
    </div>
    <div class="balance-box">
      <div class="stats-row">
        <div class="stat-group">
          <div class="balance-label">Balance</div>
          <div class="balance-amount" id="headerBalance">₹0</div>
        </div>
        <div class="stat-group" id="secondaryStat">
          <div class="balance-label" id="heroLabel">Total spent</div>
          <div class="balance-amount" id="heroAmount">₹0</div>
          <div class="balance-sub" id="heroSub">0 entries</div>
        </div>
      </div>
      <div class="save-status" id="saveStatus"></div>
    </div>
  </header>

  <div class="page-nav">
    <button class="page-nav-btn active" data-page="expenses">🏷 Expenses</button>
    <button class="page-nav-btn" data-page="balance">💰 Balance</button>
  </div>

  <div class="page active" id="expensesPage">
    <div class="tabs" id="tabBar"></div>

    <div class="sheet">
      <div class="margin-rule"></div>

      <form class="new-entry" id="entryForm">
        <div class="form-row">
          <div class="field amount-field">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option>Groceries</option>
              <option>Repairs</option>
              <option>Household</option>
              <option>Transport</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-row">
          <div class="field" style="flex:1 1 100%;">
            <label for="note">Note</label>
            <textarea id="note" placeholder="What was this for?"></textarea>
          </div>
        </div>
        <div class="voice-row">
          <button type="button" class="mic-btn" id="micBtn">🎙 Add voice note</button>
          <span class="mic-status" id="micStatus"></span>
          <span class="voice-preview" id="voicePreview" style="display:none;">
            🎧 voice note attached <button type="button" id="clearVoice">remove</button>
          </span>
        </div>
        <button type="submit" class="submit-btn">Add to the tab</button>
      </form>

      <div class="entries" id="entries"></div>
    </div>
  </div>

  <div class="page balance-page" id="balancePage">
    <div class="sheet balance-sheet">
      <div class="margin-rule balance-rule"></div>

      <form class="new-entry" id="incomeForm">
        <div class="form-row">
          <div class="field amount-field">
            <label for="incAmount">Amount (₹)</label>
            <input type="number" id="incAmount" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="field">
            <label for="incSource">Source</label>
            <select id="incSource">
              <option>Salary</option>
              <option>Savings</option>
              <option>Family/Gift</option>
              <option>Refund</option>
              <option>Other Income</option>
            </select>
          </div>
          <div class="field">
            <label for="incDate">Date</label>
            <input type="date" id="incDate" required>
          </div>
        </div>
        <div class="form-row">
          <div class="field" style="flex:1 1 100%;">
            <label for="incNote">Note (optional)</label>
            <textarea id="incNote" placeholder="Anything worth remembering about this?"></textarea>
          </div>
        </div>
        <div class="voice-row">
          <button type="button" class="mic-btn" id="micBtn2">🎙 Add voice note</button>
          <span class="mic-status" id="micStatus2"></span>
          <span class="voice-preview" id="voicePreview2" style="display:none;">
            🎧 voice note attached <button type="button" id="clearVoice2">remove</button>
          </span>
        </div>
        <button type="submit" class="submit-btn income-btn">Add to balance</button>
      </form>

      <div class="entries" id="incomeEntries"></div>
    </div>
  </div>

  <p class="footer-note" id="footerNote">entries are stored privately on this device · tap ▶ to hear a voice note</p>
</div>

<script>
// Standalone storage shim — replaces Claude.ai's artifact storage with the
// browser's own localStorage, so this app can save data once installed on a phone.
window.storage = {
  async get(key){
    const raw = localStorage.getItem('housetab:'+key);
    return raw === null ? null : { key, value: raw, shared:false };
  },
  async set(key, value){
    localStorage.setItem('housetab:'+key, value);
    return { key, value, shared:false };
  },
  async delete(key){
    localStorage.removeItem('housetab:'+key);
    return { key, deleted:true, shared:false };
  },
  async list(prefix){
    const p = 'housetab:' + (prefix||'');
    const keys = Object.keys(localStorage).filter(k=>k.startsWith(p)).map(k=>k.slice(9));
    return { keys, prefix, shared:false };
  }
};

const EXPENSE_CATEGORIES = {
  Groceries: '#5C7A5F', Repairs: '#AE4436', Household: '#7A5C8F', Transport: '#3E6B8F', Other: '#6b6156'
};
const INCOME_SOURCES = {
  Salary: '#2f7d4f', Savings: '#1f6f6f', 'Family/Gift': '#8a6d3b', Refund: '#4a7fae', 'Other Income': '#5c6b6b'
};

let entries = [];
let activeFilter = 'All';
let currentPage = 'expenses';
let pendingVoice = null;

const entriesListKey = 'house-tab:entries';

function setSaveStatus(text, isError){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = text;
  el.classList.toggle('error', !!isError);
}

async function loadEntries(){
  setSaveStatus('loading your tab…');
  try{
    const res = await window.storage.get(entriesListKey);
    entries = res ? JSON.parse(res.value) : [];
    setSaveStatus('all entries loaded');
    setTimeout(()=> setSaveStatus(''), 2000);
  }catch(e){
    entries = [];
    setSaveStatus('');
  }
  renderAll();
}

async function saveEntries(){
  const snapshot = JSON.stringify(entries);
  setSaveStatus('saving…');
  for(let attempt=1; attempt<=3; attempt++){
    try{
      const result = await window.storage.set(entriesListKey, snapshot);
      if(result){
        setSaveStatus('saved ✓');
        setTimeout(()=> setSaveStatus(''), 1500);
        return true;
      }
    }catch(e){ /* retry */ }
    await new Promise(r=> setTimeout(r, 400));
  }
  setSaveStatus('not saved — please retry or copy your entries elsewhere', true);
  return false;
}

function fmtMoney(n){
  return '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function computeRunningBalances(){
  const chron = [...entries].sort((a,b)=> a.date.localeCompare(b.date) || a.id - b.id);
  let bal = 0;
  const map = {};
  chron.forEach(e=>{
    bal += (e.type==='income') ? Number(e.amount) : -Number(e.amount);
    map[e.id] = bal;
  });
  return map;
}

function updateHeaderBalance(){
  const incomeTotal = entries.filter(e=> e.type==='income').reduce((s,e)=> s + Number(e.amount), 0);
  const expenseTotal = entries.filter(e=> e.type!=='income').reduce((s,e)=> s + Number(e.amount), 0);
  const balance = incomeTotal - expenseTotal;
  const el = document.getElementById('headerBalance');
  el.textContent = fmtMoney(Math.abs(balance)) + (balance<0 ? ' short' : '');
  el.className = 'balance-amount ' + (balance<0 ? 'negative' : 'positive');
}

function renderAll(){
  updateHeaderBalance();
  renderExpensesPage();
  renderBalancePage();
}

function renderExpensesPage(){
  const cats = ['All', ...Object.keys(EXPENSE_CATEGORIES)];
  const tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = cats.map(c =>
    `<div class="tab ${c===activeFilter?'active':''}" data-cat="${c}">${c}</div>`
  ).join('');
  tabBar.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ activeFilter = t.dataset.cat; renderExpensesPage(); });
  });

  const expenseEntries = entries.filter(e=> e.type !== 'income');
  const filtered = activeFilter==='All' ? expenseEntries : expenseEntries.filter(e=>e.category===activeFilter);
  const sorted = [...filtered].sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);
  const balanceMap = computeRunningBalances();

  const list = document.getElementById('entries');
  if(sorted.length===0){
    list.innerHTML = `<div class="empty-state">No entries yet${activeFilter!=='All' ? ' under '+activeFilter : ''}. Add the first line to the tab above.</div>`;
  } else {
    list.innerHTML = sorted.map(e => `
      <div class="entry" data-id="${e.id}">
        <div class="entry-date">${fmtDate(e.date)}</div>
        <div class="entry-main">
          <div class="entry-top">
            <span class="tag" style="background:${EXPENSE_CATEGORIES[e.category]||'#6b6156'}">${e.category}</span>
          </div>
          ${e.note ? `<p class="entry-note">${escapeHtml(e.note)}</p>` : ''}
          ${e.hasVoice ? `
            <div class="entry-voice">
              <button class="play-btn" data-play="${e.id}">▶</button>
              <span class="voice-label">voice note</span>
            </div>` : ''}
        </div>
        <div>
          <div class="entry-amount">${fmtMoney(e.amount)}</div>
          <div class="entry-balance">bal ${fmtMoney(balanceMap[e.id])}</div>
        </div>
        <button class="delete-btn" data-del="${e.id}" title="Remove entry">✕</button>
      </div>
    `).join('');
  }

  if(currentPage==='expenses'){
    const total = expenseEntries.reduce((s,e)=> s + Number(e.amount), 0);
    document.getElementById('heroLabel').textContent = 'Total spent';
    document.getElementById('heroAmount').textContent = fmtMoney(total);
    document.getElementById('heroAmount').className = 'balance-amount';
    document.getElementById('heroSub').textContent = expenseEntries.length + (expenseEntries.length===1 ? ' entry' : ' entries');
  }

  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.del;
      const ok = window.confirm("Remove this entry from the tab? This can't be undone.");
      if(!ok) return;
      entries = entries.filter(e=> String(e.id) !== String(id));
      await saveEntries();
      try{ await window.storage.delete('house-tab:voice:'+id); }catch(e){}
      renderAll();
    });
  });
  list.querySelectorAll('[data-play]').forEach(btn=>{
    btn.addEventListener('click', ()=> playVoice(btn.dataset.play, btn));
  });
}

function renderBalancePage(){
  const incomeEntries = entries.filter(e=> e.type === 'income');
  const sorted = [...incomeEntries].sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);
  const balanceMap = computeRunningBalances();

  const list = document.getElementById('incomeEntries');
  if(sorted.length===0){
    list.innerHTML = `<div class="empty-state">Nothing added to the balance yet. Log the first bit of money coming in above.</div>`;
  } else {
    list.innerHTML = sorted.map(e => `
      <div class="entry" data-id="${e.id}">
        <div class="entry-date">${fmtDate(e.date)}</div>
        <div class="entry-main">
          <div class="entry-top">
            <span class="tag" style="background:${INCOME_SOURCES[e.category]||'#5c6b6b'}">${e.category}</span>
          </div>
          ${e.note ? `<p class="entry-note">${escapeHtml(e.note)}</p>` : ''}
          ${e.hasVoice ? `
            <div class="entry-voice">
              <button class="play-btn" data-play="${e.id}">▶</button>
              <span class="voice-label">voice note</span>
            </div>` : ''}
        </div>
        <div>
          <div class="entry-amount income">↑ ${fmtMoney(e.amount)}</div>
          <div class="entry-balance">bal ${fmtMoney(balanceMap[e.id])}</div>
        </div>
        <button class="delete-btn" data-delinc="${e.id}" title="Remove entry">✕</button>
      </div>
    `).join('');
  }

  const incomeTotal = incomeEntries.reduce((s,e)=> s + Number(e.amount), 0);

  if(currentPage==='balance'){
    document.getElementById('heroLabel').textContent = 'Total received';
    document.getElementById('heroAmount').textContent = fmtMoney(incomeTotal);
    document.getElementById('heroAmount').className = 'balance-amount';
    document.getElementById('heroSub').textContent = incomeEntries.length + (incomeEntries.length===1 ? ' entry' : ' entries');
  }

  list.querySelectorAll('[data-delinc]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.delinc;
      const ok = window.confirm("Remove this from your balance? This can't be undone.");
      if(!ok) return;
      entries = entries.filter(e=> String(e.id) !== String(id));
      await saveEntries();
      try{ await window.storage.delete('house-tab:voice:'+id); }catch(e){}
      renderAll();
    });
  });
  list.querySelectorAll('[data-play]').forEach(btn=>{
    btn.addEventListener('click', ()=> playVoice(btn.dataset.play, btn));
  });
}

async function playVoice(id, btn){
  btn.textContent = '…';
  try{
    const res = await window.storage.get('house-tab:voice:'+id);
    if(!res){ btn.textContent = '▶'; return; }
    const audio = new Audio(res.value);
    btn.textContent = '❚❚';
    audio.play();
    audio.onended = ()=>{ btn.textContent = '▶'; };
  }catch(e){
    btn.textContent = '▶';
    alert('Could not load this voice note.');
  }
}

document.querySelectorAll('.page-nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentPage = btn.dataset.page;
    document.querySelectorAll('.page-nav-btn').forEach(b=> b.classList.toggle('active', b===btn));
    document.getElementById('expensesPage').classList.toggle('active', currentPage==='expenses');
    document.getElementById('balancePage').classList.toggle('active', currentPage==='balance');
    document.getElementById('secondaryStat').style.display = currentPage==='balance' ? 'none' : '';
    document.getElementById('pageSubtitle').textContent = currentPage==='expenses'
      ? 'a running account of what the house costs to keep'
      : 'money in, money out, and what is left';
    document.getElementById('footerNote').textContent = currentPage==='expenses'
      ? 'entries are stored privately on this device · tap ▶ to hear a voice note'
      : 'every rupee in is tracked with its date and where it came from';
    renderAll();
  });
});

function createVoiceRecorder({ micBtnId, micStatusId, voicePreviewId, clearBtnId, noteFieldId, recordingLabel }){
  const state = { mediaRecorder:null, audioChunks:[], recognizer:null, recording:false, pendingAudio:null };
  const micBtn = document.getElementById(micBtnId);
  const micStatus = document.getElementById(micStatusId);
  const voicePreview = document.getElementById(voicePreviewId);
  const clearBtn = document.getElementById(clearBtnId);

  micBtn.addEventListener('click', async ()=>{
    if(!state.recording){ await start(); } else { stop(); }
  });
  clearBtn.addEventListener('click', ()=>{
    state.pendingAudio = null;
    voicePreview.style.display = 'none';
  });

  async function start(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      state.audioChunks = [];
      state.mediaRecorder = new MediaRecorder(stream);
      state.mediaRecorder.ondataavailable = e => state.audioChunks.push(e.data);
      state.mediaRecorder.onstop = async ()=>{
        const blob = new Blob(state.audioChunks, {type: state.mediaRecorder.mimeType || 'audio/webm'});
        state.pendingAudio = await blobToBase64(blob);
        voicePreview.style.display = 'inline-flex';
        stream.getTracks().forEach(t=>t.stop());
      };
      state.mediaRecorder.start();

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(SR){
        state.recognizer = new SR();
        state.recognizer.continuous = true;
        state.recognizer.interimResults = false;
        state.recognizer.onresult = (ev)=>{
          let text = '';
          for(let i=0;i<ev.results.length;i++){ text += ev.results[i][0].transcript + ' '; }
          const noteField = document.getElementById(noteFieldId);
          if(!noteField.value){ noteField.value = text.trim(); }
        };
        state.recognizer.onerror = ()=>{};
        try{ state.recognizer.start(); }catch(e){}
      }

      state.recording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = recordingLabel;
      micStatus.textContent = '';
    }catch(err){
      micStatus.textContent = 'Microphone unavailable — you can still type a note.';
    }
  }

  function stop(){
    state.recording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎙 Add voice note';
    if(state.mediaRecorder && state.mediaRecorder.state !== 'inactive'){ state.mediaRecorder.stop(); }
    if(state.recognizer){ try{ state.recognizer.stop(); }catch(e){} }
  }

  function blobToBase64(blob){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onloadend = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  return {
    stopIfRecording(){ if(state.recording) stop(); },
    hasAudio(){ return !!state.pendingAudio; },
    takeAudio(){ const a = state.pendingAudio; state.pendingAudio = null; voicePreview.style.display='none'; return a; }
  };
}

const expenseVoice = createVoiceRecorder({
  micBtnId:'micBtn', micStatusId:'micStatus', voicePreviewId:'voicePreview', clearBtnId:'clearVoice',
  noteFieldId:'note', recordingLabel:'⏺ Recording… tap to stop'
});
const incomeVoice = createVoiceRecorder({

});

const form = document.getElementById('entryForm');
document.getElementById('date').valueAsDate = new Date();

form.addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  expenseVoice.stopIfRecording();

  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const date = document.getElementById('date').value;
  const note = document.getElementById('note').value.trim();
  if(!amount || amount <= 0) return;

  const id = Date.now();
  const hasVoice = expenseVoice.hasAudio();
  const audio = hasVoice ? expenseVoice.takeAudio() : null;

  entries.push({ id, amount, category, date, note, hasVoice, type: 'expense' });
  await saveEntries();

  if(hasVoice){
    try{
      const result = await window.storage.set('house-tab:voice:'+id, audio);
      if(!result){ setSaveStatus('voice note did not save', true); }
    }catch(e){
      setSaveStatus('voice note did not save', true);
    }
  }

  form.reset();
  document.getElementById('date').valueAsDate = new Date();

  renderAll();
});
